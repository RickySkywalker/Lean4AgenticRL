[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pswf-tb21-eval"
version = "1.0.0"
description = "Evaluation kit: LAR-27B on TerminalBench-2.1 with the PSWF Terminus-2 harness (serving, task prep, network guard, harbor job, scoring)"
requires-python = ">=3.12"
license = {file = "LICENSE"}
# No dependencies on purpose: the kit is installed into both environments of the Quickstart. The serving env
# brings sglang/sglang-router; the evaluation env brings harbor (+ fastapi/uvicorn/httpx used by the model guard).
dependencies = []

[tool.setuptools.packages.find]
include = ["tb21_eval*"]

[tool.setuptools.package-data]
tb21_eval = ["assets/*.md", "assets/*.txt", "assets/*.json", "assets/apt/*", "guard/*.py", "guard/*.txt", "guard/*.in"]
